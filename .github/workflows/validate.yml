name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tests/test_analysis_live.py re-derives a recorded git tree id from history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the version the checks were developed and verified with
      - run: python -m pip install -r requirements.txt
      - run: python -m tests.validate_all
